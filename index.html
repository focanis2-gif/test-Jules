<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focanis Airlines</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Focanis Airlines</h1>
    </header>
    <main>
        <section id="booking">
            <h2>Book a Flight</h2>
            <form id="booking-form">
                <div class="form-group">
                    <label for="departure">Departure:</label>
                    <input type="text" id="departure" name="departure" placeholder="City or Airport" required>
                </div>
                <div class="form-group">
                    <label for="arrival">Arrival:</label>
                    <input type="text" id="arrival" name="arrival" placeholder="City or Airport" required>
                </div>
                <div class="form-group">
                    <label for="departure-date">Departure Date:</label>
                    <input type="date" id="departure-date" name="departure-date" required>
                </div>
                <div class="form-group">
                    <label for="return-date">Return Date:</label>
                    <input type="date" id="return-date" name="return-date">
                </div>
                <div class="form-group">
                    <label for="passengers">Passengers:</label>
                    <input type="number" id="passengers" name="passengers" min="1" value="1" required>
                </div>
                <button type="submit">Book Now</button>
            </form>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
